# Seeed reTerminal E1001 (7.5" 800x480 mono e-paper, ESP32-S3) showing the PNGs rendered by Home Assistant.
#
# Each wake: join Wi-Fi -> download one PNG -> draw it -> deep sleep until just after the next quarter hour
# (the HA automation renders at :00/:15/:30/:45).
#   timer wake / power-on : Home      left white button : Week      right white button : Weather
#   green button          : Home, and stay awake 10 min (for OTA uploads and logs)
# After a power-on or USB reset the panel also stays awake 10 min, so you can flash and read logs.
#
# Pins are from Seeed's reTerminal E-series ESPHome cookbook. NOT yet compiled or run on a device:
# start with `esphome config family-calendar.yaml`.

substitutions:
  name: family-calendar
  base_url: !secret eink_base_url        # e.g. http://192.168.1.50:8123/local/eink-RANDOM/  (trailing slash)
  # If the first picture looks like a photographic negative, flip this.
  negative: "false"

esphome:
  name: ${name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: battery_enable
        - lambda: |-
            // stay awake for flashing/logging after anything but a normal wake from deep sleep, or on the green button
            bool green = esp_sleep_get_ext1_wakeup_status() & (1ULL << 3);
            id(dev_mode) = green || esp_reset_reason() != ESP_RST_DEEPSLEEP;
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return id(dev_mode);'
            then:
              - deep_sleep.prevent: sleeper

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0      # the E-series USB port is a CH340 bridge on UART0

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true         # skip the scan; fine for a single known network
  on_connect:
    - online_image.set_url:
        id: page_img
        url: !lambda |-
          std::string base = "${base_url}";
          uint64_t pressed = esp_sleep_get_ext1_wakeup_status();
          if (pressed & (1ULL << 5)) return base + "week.png";      // left white button
          if (pressed & (1ULL << 4)) return base + "weather.png";   // right white button
          return base + "home.png";                                 // timer, green button, power-on

http_request:
  timeout: 15s
  watchdog_timeout: 30s

time:
  - platform: sntp
    id: sntp_time
    timezone: America/New_York

globals:
  - id: dev_mode
    type: bool
    initial_value: "false"

deep_sleep:
  id: sleeper
  run_duration: 120s         # failsafe if Wi-Fi or the download never completes
  sleep_duration: 15min
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        mode: INPUT_PULLUP
      - number: GPIO4
        mode: INPUT_PULLUP
      - number: GPIO5
        mode: INPUT_PULLUP
    mode: ANY_LOW

image:
  - platform: online_image
    id: page_img
    url: "http://invalid.local/"      # replaced at runtime in wifi.on_connect
    format: PNG
    type: BINARY
    update_interval: never
    on_download_finished:
      - script.execute: show_and_sleep
    on_error:
      - logger.log: "Download or decode failed; retrying in 2 minutes"
      - delay: 1s
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: 2min

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable        # powers the battery voltage divider

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0
  - platform: template
    id: battery_percent
    update_interval: never
    unit_of_measurement: "%"
    lambda: 'return id(battery_voltage).state;'
    filters:
      - calibrate_linear:
          - 3.27 -> 0
          - 3.30 -> 5
          - 3.41 -> 10
          - 3.49 -> 20
          - 3.58 -> 30
          - 3.68 -> 40
          - 3.75 -> 50
          - 3.80 -> 60
          - 3.85 -> 70
          - 3.91 -> 80
          - 3.96 -> 90
          - 4.15 -> 100
      - clamp:
          min_value: 0
          max_value: 100

font:
  - file: "gfonts://Inter@700"
    id: font_small
    size: 18

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-
      // BINARY images set bits for bright pixels, so draw them as "off" (white) unless negative is true
      Color on = ${negative} ? COLOR_ON : COLOR_OFF;
      Color off = ${negative} ? COLOR_OFF : COLOR_ON;
      it.image(0, 0, id(page_img), on, off);
      id(battery_voltage).update();
      id(battery_percent).update();
      if (id(battery_percent).has_state() && id(battery_percent).state < 15) {
        it.filled_rectangle(630, 450, 170, 30, COLOR_ON);
        it.printf(640, 455, id(font_small), COLOR_OFF, "LOW BATTERY %.0f%%", id(battery_percent).state);
      }

script:
  - id: show_and_sleep
    then:
      - component.update: epaper
      - delay: 3s                          # let the panel finish its refresh before power-down
      - if:
          condition:
            lambda: 'return id(dev_mode);'
          then:
            - logger.log: "Dev mode: staying awake for 10 minutes"
            - delay: 10min
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: !lambda |-
            // Wake 2 min after the next quarter hour (the HA automation renders on the quarter hour);
            // overnight, sleep until 05:45 when the automation resumes.
            auto t = id(sntp_time).now();
            if (!t.is_valid()) return 15 * 60 * 1000;
            int s = t.hour * 3600 + t.minute * 60 + t.second;
            int wake = (s / 900 + 1) * 900 + 120;
            if (s >= 22 * 3600 + 30 * 60) wake = 24 * 3600 + 5 * 3600 + 45 * 60;
            else if (s < 5 * 3600 + 45 * 60) wake = 5 * 3600 + 45 * 60;
            return (wake - s) * 1000;
